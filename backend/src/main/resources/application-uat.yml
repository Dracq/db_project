spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:reconx_uat}
    username: ${POSTGRES_USER:reconx_uat}
    password: ${POSTGRES_PASSWORD:reconx_uat}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      connection-timeout: 5000
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.batch_size: 50

logging:
  level:
    com.dbtraining.reconx: INFO
