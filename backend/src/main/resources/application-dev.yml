spring:
  datasource:
    url: jdbc:h2:mem:reconx;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console

  # H2 doesn't ship a JSONB type — Liquibase preconditions in the changelog skip
  # the JSONB GIN-index step on H2 (see 003-jsonb.xml).
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: validate                  # Liquibase does the create — JPA only validates

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    listener:
      missing-topics-fatal: false   # don't blow up if Kafka isn't running locally

logging:
  level:
    com.dbtraining.reconx: DEBUG
    org.hibernate.SQL: DEBUG
management:
  endpoints:
    web:
      exposure:
        include: health,info
